name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate skill structure
        run: python3 scripts/validate_skills.py

      - name: Compile Python files
        run: python3 -m compileall -q skills scripts

      - name: Install handbook helper dependency
        run: python3 -m pip install -r skills/codebase-handbook/scripts/requirements.txt

      - name: Exercise codebase handbook helpers and regressions
        run: python3 skills/codebase-handbook/scripts/test_handbook.py
